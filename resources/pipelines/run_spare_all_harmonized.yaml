pipeline_name: SPARE Scores - All-Inclusive (T1 only, Harmonized)
description: |
  Pipeline which uses harmonized DLMUSE features to produce all available SPARE scores using T1 scans.

categories:
  - spare
  - inference
  - classification
  - harmonized
  - highlighted

requires:
  - needs_T1
  - needs_demographics
  - csv_has_columns:
      - name: MRID
        type: string
      - name: Age
        type: float
        min: 0
        max: 120
      - name: Sex
        type: categorical
        values: [M, F]
  - min_subjects:
      required: 3
      recommended: 30

steps:
  - id: run_nichart_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_seg: ${STUDY}/dlmuse_seg
      dlmuse_vol: ${STUDY}/dlmuse_vol

  - id: harmonize_dlmuse
    tool: harmonize_dlmuse
    inputs:
      dlmuse_vol_unharmonized: ${STUDY}/dlmuse_vol/DLMUSE_Volumes.csv
      covariate_csv: ${STUDY}/participants/participants.csv
    outputs:
      dlmuse_vol_harmonized: ${STUDY}/dlmuse_vol_harmonized

  - id: run_spare_all
    tool: spare_all_harmonized
    inputs:
      dlmuse_vol_harmonized: ${STUDY}/dlmuse_vol_harmonized/DLMUSE_Volumes.csv
      demog_csv: ${STUDY}/participants/participants.csv
    outputs:
      spare_all_csv: ${STUDY}/ml_biomarkers/SPARE_ALL.csv
