pipeline_name: SPARE Scores - All-Inclusive (T1 + FLAIR)
description: |
  Pipeline which uses DLMUSE and DLWMLS features to produce all available CVM SPARE scores from T1 + FLAIR data.

docs_id: spare
harmonized_variant: run_spare_all_cvm_harmonized

categories:
  - spare
  - inference
  - classification
  - highlighted
  - cvm

requires:
  - needs_T1
  - needs_FLAIR
  - needs_demographics
  - csv_has_columns:
      - name: MRID
        type: string
      - name: Age
        type: float
        min: 0
        max: 120
      - name: Sex
        type: categorical
        values: [M, F]

steps:
  - id: run_nichart_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_seg: ${STUDY}/dlmuse_seg
      dlmuse_vol: ${STUDY}/dlmuse_vol

  - id: run_nichart_dlwmls
    tool: nichart_dlwmls_v2
    inputs:
      t1_img: ${STUDY}/t1
      fl_img: ${STUDY}/fl
      dlmuse_seg: ${STUDY}/dlmuse_seg
      demog_csv: ${STUDY}/participants/participants.csv
    outputs:
      nichart_dlwmls_out: ${STUDY}/nichart_dlwmls_out

  - id: merge_feature_csvs
    tool: merge_feature_csvs_by_mrid
    inputs:
      csv_1: ${STUDY}/dlmuse_vol/DLMUSE_Volumes.csv
      csv_2: ${STUDY}/nichart_dlwmls_out/DLWMLS_DLMUSE_Segmented_Volumes.csv
    outputs:
      out_csv: ${STUDY}/merged_dlmuse_dlwmls/csv_out.csv

  - id: run_spare_all_cvm
    tool: spare_all_cvm
    inputs:
      merged_dlwmls_dlmuse_csv: ${STUDY}/merged_dlmuse_dlwmls/csv_out.csv
      demog_csv: ${STUDY}/participants/participants.csv
    outputs:
      spare_all_cvm_csv: ${STUDY}/ml_biomarkers/SPARE_ALL_CVM.csv

results:
  batch_features:
    file: "ml_biomarkers/SPARE_ALL_CVM.csv"
    mrid_column: "MRID"
