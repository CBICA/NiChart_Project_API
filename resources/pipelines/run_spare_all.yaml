pipeline_name: SPARE Scores - All-Inclusive (T1 only)
description: |
  Pipeline which uses DLMUSE features to produce all available SPARE scores using T1 scans.

docs_id: spare
harmonized_variant: run_spare_all_harmonized

categories:
  - spare
  - inference
  - classification
  - highlighted
  - brain-age

requires:
  - needs_T1
  - needs_demographics
  - csv_has_columns:
      - name: MRID
        type: string
      - name: Age
        type: float
        min: 0
        max: 120
      - name: Sex
        type: categorical
        values: [M, F]

steps:
  - id: run_nichart_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_seg: ${STUDY}/dlmuse_seg
      dlmuse_vol: ${STUDY}/dlmuse_vol

  - id: run_spare_all
    tool: spare_all
    inputs:
      dlmuse_vol: ${STUDY}/dlmuse_vol/DLMUSE_Volumes.csv
      demog_csv: ${STUDY}/participants/participants.csv
    outputs:
      spare_all_csv: ${STUDY}/ml_biomarkers/SPARE_ALL.csv

results:
  batch_features:
    file: "ml_biomarkers/SPARE_ALL.csv"
    mrid_column: "MRID"
