pipeline_name: DL-BA
root_pipeline: bascores
harmonized: false
modalities: [T1]
description: |
  Brain age regression pipeline starting from T1 scans. Outputs attention maps alongside biomarker scores.

docs_id: bascores

categories:
  - image-to-biomarker
  - brain-age
  - regression
  - inference

requires:
  - needs_T1

steps:
  - id: run_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_vol: ${STUDY}/dlmuse_vol
      dlmuse_seg: ${STUDY}/dlmuse_seg

  - id: binarize_dlmuse_to_dlicv
    tool: binarize_seg_to_mask
    inputs:
      seg_dir: ${STUDY}/dlmuse_seg
    outputs:
      mask_dir: ${STUDY}/dlicv_mask

  - id: align_dlicv_to_mni
    tool: dlicv_to_mni
    inputs:
      img_dir: ${STUDY}/t1
      mask_dir: ${STUDY}/dlicv_mask
    outputs:
      mni_dir: ${STUDY}/t1_mni

  - id: run_nichart_bascores
    tool: nichart_bascores
    inputs:
      t1_img: ${STUDY}/t1_mni
    outputs:
      out_csv: ${STUDY}/dl-ba/SPARE_BA_Image.csv
      out_attention: ${STUDY}/dl-ba_attention

results:
  batch_features:
    file: "dl-ba/SPARE_BA_Image.csv"
    mrid_column: "MRID"
    # `features` is OPTIONAL here: the ROI volume columns are documented via
    # `label_map` + `column_template` below. Add entries only for non-ROI summary
    # columns that need explanation. See SCHEMA.md (results → features); checked
    # by scripts/check_feature_docs.py.
    features: {}
    label_map: "atlases/muse/muse_mapping_derived.csv"
    column_template: "DL_MUSE_Volume_{id}"
    default_unit: "mm³"
    feature_groups:
      - name: "Global"
        label_id_range: [600, 702]
      - name: "Lobar"
        label_id_range: [500, 525]
      - name: "Sub-lobar Bilateral"
        label_id_range: [400, 436]
      - name: "Sub-lobar Hemispheric"
        label_id_range: [300, 345]
      - name: "Individual Regions"
        label_id_range: [1, 207]
  per_subject:
    - id: "dl-ba-attention"
      pattern: "dl-ba_attention/{MRID}_DLICV_aligned.nii.gz"
      type: "segmentation_nifti"
      display_name: "DL-BA Attention Maps"
