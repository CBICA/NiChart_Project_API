pipeline_name: DLWMLS
root_pipeline: dlwmls
harmonized: false
modalities: [T1, FLAIR]
description: |
  White matter lesion segmentation pipeline starting from FLAIR-weighted and T1-weighted brain scans.

docs_id: dlwmls
harmonized_variant: run_nichart_dlwmls_v2_harmonized

categories:
  - image-processing
  - segmentation
  - feature-extraction
  - lesions

requires:
  - needs_T1
  - needs_FLAIR

steps:
  - id: run_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_seg: ${STUDY}/dlmuse_seg
      dlmuse_vol: ${STUDY}/dlmuse_vol

  - id: run_nichart_dlwmls
    tool: nichart_dlwmls_v2
    inputs:
      t1_img: ${STUDY}/t1
      fl_img: ${STUDY}/fl
      dlmuse_seg: ${STUDY}/dlmuse_seg
      demog_csv: ${STUDY}/participants/participants.csv
    outputs:
      nichart_dlwmls_out: ${STUDY}/nichart_dlwmls_out

  - id: merge_feature_csvs
    tool: merge_feature_csvs_by_mrid
    inputs:
      csv_1: ${STUDY}/dlmuse_vol/DLMUSE_Volumes.csv
      csv_2: ${STUDY}/nichart_dlwmls_out/DLWMLS_DLMUSE_Segmented_Volumes.csv
    outputs:
      out_csv: ${STUDY}/merged_dlmuse_dlwmls/csv_out.csv

results:
  batch_features:
    file: "nichart_dlwmls_out/DLWMLS_DLMUSE_Segmented_Volumes.csv"
    mrid_column: "MRID"
    label_map: "atlases/muse/muse_mapping_derived.csv"
    column_template: "DL_WMLS_Volume_{id}"
    default_unit: "mm³"
    # These label_ids are MUSE region IDs, and only the region-labelled output
    # carries them as voxel values; the FLAIR-space output is a 0/1 mask where
    # they would highlight nothing. Verified: the 30 distinct non-zero values
    # across a 4-subject run are all IDs present in muse_mapping_derived.csv.
    label_output_id: wml_segmentation_rois
  per_subject:
    # Verified against a real run of cbica/nichart_dlwmls:0.0.3 (4 subjects):
    # both files exist with these names, and each shares its underlay's grid
    # and affine exactly. Nested one level inside the step's output directory,
    # which is why scripts/check_pipeline_tool_filenames.py cannot cross-check
    # these patterns against the tool's declared `contents`.
    - id: "wml_segmentation_rois"
      # Lesions labelled by DLMUSE ROI id, after FLAIR->T1 registration. Same
      # grid as t1/{MRID}.nii.gz and dlmuse_seg/{MRID}_DLMUSE.nii.gz, so it
      # overlays on the T1 like the DLMUSE segmentation does.
      pattern: "nichart_dlwmls_out/DLWMLS_DLMUSE_Segmented/{MRID}_DLWMLS_DLMUSE_Segmented.nii.gz"
      type: "segmentation_nifti"
      display_name: "White matter lesions by region (T1 space)"
      underlay: t1
      content: labels
    - id: "wml_segmentation"
      # The raw binary lesion mask, in the LPS-reoriented FLAIR grid. That grid
      # equals fl/{MRID}.nii.gz only when the uploaded FLAIR was already LPS,
      # which is the case for images NiChart has reoriented but not guaranteed
      # for arbitrary uploads -- see the note in the reply/commit message.
      pattern: "nichart_dlwmls_out/DLWMLS_FLAIR/{MRID}_FL_LPS_DLWMLS.nii.gz"
      type: "segmentation_nifti"
      display_name: "White matter lesion mask (FLAIR space)"
      underlay: fl
      content: mask      # verified {0, 1}
