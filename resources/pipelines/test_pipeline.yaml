pipeline_name: test_pipeline
root_pipeline: test_pipeline
harmonized: false
modalities: []
description: >
  Single-step pipeline that runs a configurable sleep and writes placeholder output.
  Used for testing the pipeline submission, step caching, provenance writing, and
  polling API without imaging data.
categories:
  - testing
requires: []

# User-overridable parameters.
# These are exposed by GET /catalog/pipelines/test_pipeline and accepted
# as the `params` body field on POST /projects/{id}/jobs/pipelines.
parameters:
  duration_seconds:
    type: int
    default: 10
    description: How many seconds the test sleep should run.
    min: 1
    max: 600

steps:
  - id: sleep
    tool: test_sleep
    inputs: {}
    outputs:
      result: "${STUDY}/test_output"
    # No step-level params: the user-supplied duration_seconds flows through directly.
