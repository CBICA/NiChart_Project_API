pipeline_name: dummy_pipeline
description: >
  Single-step pipeline that runs a configurable sleep.
  Used for testing the pipeline submission and polling API without imaging data.
categories:
  - testing
requires: []

# User-overridable parameters.
# These are exposed by GET /catalog/pipelines/dummy_pipeline and accepted
# as the `params` body field on POST /projects/{id}/jobs/pipelines.
parameters:
  duration_seconds:
    type: int
    default: 10
    description: How many seconds the dummy sleep should run.
    min: 1
    max: 300

steps:
  - id: sleep
    tool: dummy_sleep
    inputs: {}
    outputs: {}
    # No step-level params: the user-supplied duration_seconds flows through directly.
