pipeline_name: ITHResolve-GBM
root_pipeline: ithresolve_gbm
harmonized: false
modalities: [idat]
description: |
  Takes IDAT epigenetic data arrays and produces tumor composition measures (methylation signatures).

docs_id: ithresolve_gbm

categories:
  - glioblastoma
  - epigenomics

requires:
  - needs_idat

steps:
  - id: run_ithresolve_gbm
    tool: ithresolve_gbm
    inputs:
      idat_dir: ${STUDY}/idat
    outputs:
      output_dir: ${STUDY}/ithresolve_gbm_output
