pipeline_name: GenFAR
root_pipeline: genfar
harmonized: false
modalities: [T1]
description: |
  Runs GenFAR inference models from T1 scans aligned to MNI ICBM152 space.

docs_id: genfar

categories:
  - image-to-biomarker
  - regression
  - inference

requires:
  - needs_T1

steps:
  - id: run_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_vol: ${STUDY}/dlmuse_vol
      dlmuse_seg: ${STUDY}/dlmuse_seg

  - id: binarize_dlmuse_to_dlicv
    tool: binarize_seg_to_mask
    inputs:
      seg_dir: ${STUDY}/dlmuse_seg
    outputs:
      mask_dir: ${STUDY}/dlicv_mask

  - id: align_dlicv_to_mni_icbm152
    tool: dlicv_to_mni_icbm152
    inputs:
      img_dir: ${STUDY}/t1
      mask_dir: ${STUDY}/dlicv_mask
    outputs:
      mni_dir: ${STUDY}/t1_mni_icbm152

  - id: run_genfar
    tool: genfar
    inputs:
      t1_dir: ${STUDY}/t1_mni_icbm152
    outputs:
      output_dir: ${STUDY}/genfar

results:
  batch_features:
    file: "genfar/features_combined.csv"
    display_name: "GenFAR Features"
    mrid_column: "MRID"
    # Feature interpretation for the LLM / UI. Document each output column here —
    # see resources/pipelines/SCHEMA.md (results → features). Completeness is
    # checked by scripts/check_feature_docs.py.
    # TODO: replace {} with entries — definition (required), units, direction,
    #       interpretation, keywords, references + DOIs.
    features: {}

