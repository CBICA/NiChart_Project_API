pipeline_name: DLMUSE (Harmonized)
root_pipeline: dlmuse
harmonized: true
modalities: [T1]
description: |
  Segmentation pipeline starting from T1-weighted MRI brain scans, with harmonization to the NiChart reference dataset.

docs_id: dlmuse
base_variant: run_dlmuse

categories:
  - image-processing
  - segmentation
  - feature-extraction
  - harmonized
  - highlighted

requires:
  - needs_T1
  - needs_demographics
  - csv_has_columns:
      - name: MRID
        type: string
      - name: Age
        type: float
        min: 0
        max: 120
      - name: Sex
        type: categorical
        values: [M, F]
      - name: DX
        type: string
  - min_subjects:
      required: 30
      recommended: 30
      # Per-cohort minimums. Each entry counts subjects that have imaging AND a
      # participants.csv row matching every condition under `where`; conditions
      # combine with AND. String matches are case-insensitive. `required` /
      # `recommended` default to the parent values above.
      # `per: Batch` applies the minimum within each batch: harmonization parameters
      # are estimated from CN subjects, separately for every batch.
      constraints:
        - label: Cognitively normal controls
          per: Batch
          where:
            - column: DX
              equals: CN

steps:
  - id: run_nichart_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_seg: ${STUDY}/dlmuse_seg
      dlmuse_vol: ${STUDY}/dlmuse_vol

  - id: harmonize_dlmuse
    tool: harmonize_dlmuse
    inputs:
      dlmuse_vol_unharmonized: ${STUDY}/dlmuse_vol/DLMUSE_Volumes.csv
      covariate_csv: ${STUDY}/participants/participants.csv
    outputs:
      dlmuse_vol_harmonized: ${STUDY}/dlmuse_vol_harmonized

results:
  batch_features:
    file: "dlmuse_vol_harmonized/DLMUSE_Volumes.csv"
    display_name: "Regional Volumes"
    mrid_column: "MRID"
    # `features` is OPTIONAL here: the ROI volume columns are documented via
    # `label_map` + `column_template` below. Add entries only for non-ROI summary
    # columns that need explanation. See SCHEMA.md (results → features); checked
    # by scripts/check_feature_docs.py.
    features: {}
    label_map: "atlases/muse/muse_mapping_derived.csv"
    column_template: "H_DL_MUSE_Volume_{id}"
    default_unit: "mm³"
    feature_groups:
      - name: "Global"
        label_id_range: [600, 702]
      - name: "Lobar"
        label_id_range: [500, 525]
      - name: "Sub-lobar Bilateral"
        label_id_range: [400, 436]
      - name: "Sub-lobar Hemispheric"
        label_id_range: [300, 345]
      - name: "Individual Regions"
        label_id_range: [1, 207]
  per_subject:
    - id: "segmentation"
      pattern: "dlmuse_seg/{MRID}_DLMUSE.nii.gz"
      type: "segmentation_nifti"
      display_name: "DLMUSE segmentation"
      # Verified affine-identical to the subject's stored t1/{MRID}.nii.gz.
      underlay: t1
      content: labels
      # Single image output, so batch_features.label_output_id is unnecessary:
      # there is nothing for a feature's label_ids to be ambiguous between.
  atlas: "atlases/muse/MNI152_1mm_LPS.nii.gz"
  atlas_segmentation: "atlases/muse/MNI152_1mm_LPS_DLMUSE.nii.gz"
