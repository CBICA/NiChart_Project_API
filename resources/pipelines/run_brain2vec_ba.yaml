pipeline_name: Brain Age (Brain2Vec ViT)
modalities: [T1]
description: |
  Predicts brain age from T1-weighted MRI using a Vision Transformer fine-tuned on
  Brain2Vec representations. Produces one predicted brain age (in years) per subject.
  Uses the ViT brain-age model weights baked into the Brain2Vec image — no
  user-supplied weights are required.

input_notes:
  - "Upload raw (unprocessed) T1 images — not skull-stripped, bias-corrected or registered T1s."
  - "This pipeline skull-strips and aligns your scans for you; upload the raw images as they came off the scanner."

categories:
  - feature-extraction
  - brain-age

requires:
  - needs_T1

steps:
  # ── Preprocessing ───────────────────────────────────────────────────────────
  # Brain2Vec is trained on skull-stripped scans affinely aligned to its own
  # template (upstream: preprocessing/brain2vec_preprocess.py). That template is
  # byte-identical to the ICBM152 DLICV template already baked into
  # cbica/nifti-align-to-mni, so the existing DLMUSE -> binarize -> align chain
  # produces the same product and no Brain2Vec-specific preprocessing container
  # is needed. Alignment is the same SimpleITK affine step run_bascores uses, with
  # the mask taken from the DLMUSE segmentation so DLMUSE is not run twice. The
  # step id and output path match run_bascores so both pipelines share the cached
  # alignment. Validated on 30 IXI subjects: brain age r=0.929 / MAE 5.96 y from
  # aligned input, vs r=-0.024 / MAE 17.80 y from raw T1 (worse than guessing the
  # cohort mean). Upstream preprocesses with FSL FLIRT rather than SimpleITK, so
  # the residual +4.3 y bias on that cohort may be partly a registration
  # difference -- to be raised with the Brain2Vec authors.
  - id: run_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_vol: ${STUDY}/dlmuse_vol
      dlmuse_seg: ${STUDY}/dlmuse_seg

  - id: binarize_dlmuse_to_dlicv
    tool: binarize_seg_to_mask
    inputs:
      seg_dir: ${STUDY}/dlmuse_seg
    outputs:
      mask_dir: ${STUDY}/dlicv_mask

  - id: align_dlicv_to_mni
    tool: dlicv_to_mni
    inputs:
      img_dir: ${STUDY}/t1
      mask_dir: ${STUDY}/dlicv_mask
    outputs:
      mni_dir: ${STUDY}/t1_mni

  # ── Inference ───────────────────────────────────────────────────────────────
  - id: run_brain2vec_ba
    tool: nichart_brain2vec_ba
    inputs:
      t1_img: ${STUDY}/t1_mni
    outputs:
      out_dir: ${STUDY}/brain2vec_ba
    params: {}

outputs:
  download_dirs:
    - ${STUDY}/brain2vec_ba
  tabular_output:
    - ${STUDY}/brain2vec_ba/ViT_BA_Predictions.csv

results:
  batch_features:
    file: "brain2vec_ba/ViT_BA_Predictions.csv"
    mrid_column: "MRID"
    features:
      Prediction:
        label: "Predicted brain age"
        definition: >
          Brain age predicted from a T1-weighted MRI by a Vision Transformer
          fine-tuned on Brain2Vec representations — the model's estimate of the age
          the brain "looks like", independent of chronological age.
        units: "years"
        direction: "higher = older-appearing brain than chronological age"
        interpretation: >
          Interpreted against chronological age: the brain-age gap
          (predicted − chronological) is the quantity of interest; a positive gap
          suggests accelerated brain aging. A single value is not a diagnosis.
        keywords:
          - "brain age"
          - "brain age gap"
          - "BrainAGE"
          - "accelerated brain aging"
        # TODO: add the Brain2Vec / brain-age reference citation(s) + DOI(s).
        references: []
