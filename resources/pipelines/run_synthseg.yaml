pipeline_name: SynthSeg
root_pipeline: synthseg
harmonized: false
modalities: [T1]
description: |
  Whole-brain MRI segmentation using SynthSeg. Produces segmentation label maps
  and a CSV of regional volumes (mm³). SynthSeg accepts any single MRI modality;
  this pipeline runs on T1-weighted scans.

docs_id: synthseg

categories:
  - image-processing
  - segmentation
  - feature-extraction

requires:
  - needs_T1

steps:
  - id: run_synthseg
    tool: synthseg # MUST CORRESPOND EXACTLY to a tool in resources/tools dir
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      synthseg_seg: ${STUDY}/synthseg_seg
      synthseg_vol: ${STUDY}/synthseg_vol

outputs:
  download_dirs:
    - ${STUDY}/synthseg_seg
    - ${STUDY}/synthseg_vol
  tabular_output:
    - ${STUDY}/synthseg_vol/volumes.csv

results:
  batch_features:
    file: "synthseg_vol/volumes.csv"
    # NOTE: verify this against the actual volumes.csv header. SynthSeg's native
    # output labels the subject column "subject"; if the wrapper doesn't rename
    # it to MRID, set mrid_column accordingly or the results will be empty.
    mrid_column: "MRID"
    default_unit: "mm³"
    # CSV columns are the ROI names themselves, so the template uses {name} (the mapping's
    # second column) rather than {id}. Label ids are SynthSeg/FreeSurfer labels; composite
    # rows (total intracranial, left/right cerebral cortex) list their constituent labels.
    label_map: "atlases/synthseg/synthseg_mapping_derived.csv"
    column_template: "{name}"
    # feature_groups omitted: label_id_range grouping doesn't fit SynthSeg's id scheme.

  per_subject:
    - id: "segmentation"
      pattern: "synthseg_seg/{MRID}_synthseg.nii.gz"
      type: "segmentation_nifti"
      display_name: "SynthSeg segmentation"

  # atlas / atlas_segmentation omitted: no SynthSeg atlas template exists yet.
  # Add both once available to enable the centile/overlay viewer.
