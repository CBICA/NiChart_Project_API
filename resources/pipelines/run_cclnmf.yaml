pipeline_name: CCL-NMF Component Prediction
description: |
  Prediction of Coupled Cross-Sectional Non-negative Matrix Factorization loading coefficients
  from T1-weighted MRI using DLMUSE brain volumes.

docs_id: cclnmf

categories:
  - regression
  - inference

requires:
  - needs_T1
  - needs_demographics
  - csv_has_columns:
      - name: MRID
        type: string
      - name: Age
        type: float
        min: 0
        max: 120
      - name: Sex
        type: categorical
        values: [M, F]

steps:
  - id: run_nichart_dlmuse
    tool: nichart_dlmuse
    inputs:
      t1_img: ${STUDY}/t1
    outputs:
      dlmuse_seg: ${STUDY}/dlmuse_seg
      dlmuse_vol: ${STUDY}/dlmuse_vol

  - id: run_cclnmf
    tool: cclnmf_prediction
    inputs:
      demog_csv: ${STUDY}/participants/participants.csv
      dlmuse_vol: ${STUDY}/dlmuse_vol/DLMUSE_Volumes.csv
    outputs:
      cclnmf_csv: ${STUDY}/ml_biomarkers/CCLNMF_prediction_loadings.csv

results:
  batch_features:
    file: "ml_biomarkers/CCLNMF_prediction_loadings.csv"
    mrid_column: "MRID"
