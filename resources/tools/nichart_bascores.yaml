name: NiChart_BAScores
description: >
  Extracts direct image-to-biomarker brain aging scores from MNI-aligned T1 scans
  and produces attention maps for visualization.

inputs:
  t1_img:
    type: directory

outputs:
  out_csv:
    type: file
  out_attention:
    type: directory

mounts:
  t1_img:
    path_in_container: /input/t1
    mode: ro
  out_csv:
    path_in_container: /output/SPARE_BA_Image.csv
    mode: rw
  out_attention:
    path_in_container: /output/output_attention
    mode: rw

parameters: {}

resources:
  vcpus: 4
  memory: 14000
  gpus: 1

# Measured 2026-11-12 on cbica/nichart_bascores:0.0.1, this dev box (GTX 1080 Ti,
# Xeon E5-2623 v3), two cohort sizes: 8.9 s at N=1 and 9.6 s at N=8 => ~9 s fixed
# plus ~0.1 s/subject. Almost entirely container start, CUDA init and loading the
# weights; scoring and writing the attention maps is fast. Measured on raw T1s
# rather than the MNI-aligned t1_mni the pipeline feeds it, which are the same
# size, so the per-subject figure carries over.
fixed_seconds: 9
time_per_subject_seconds: 0.1

container:
  image: cbica/nichart_bascores:0.0.1
  command: -i {t1_img} -o {out_attention} --csv {out_csv} --device cuda
