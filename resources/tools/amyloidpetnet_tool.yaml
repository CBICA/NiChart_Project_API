# NiChart tool definition for AmyloidPETNet inference.

name: AmyloidPETNet Inference
description: >
  Runs AmyloidPETNet on a flat directory of PET NIfTI files. The wrapper script
  builds the input CSV expected by predict.py, executes inference, and writes
  predictions.csv (columns: MRID, img_path, y_score) to the output mount.

inputs:
  input_data:
    type: directory

outputs:
  output_data:
    type: directory
    # Observed: predictions.csv with MRID, img_path, y_score; one row per scan
    # (4 rows at N=4, 16 at N=16). Matches results.batch_features.
    contents:
      - pattern: "predictions.csv"
        csv_columns: [MRID]
        rows_per_subject: true

mounts:
  input_data:
    path_in_container: /input
    mode: ro
  output_data:
    path_in_container: /output
    mode: rw

parameters: {}

resources:
  vcpus: 2
  memory: 8000
  gpus: 1

# Measured 2026-11-12 on cbica/amyloidpetnet:0.0.1, this dev box (GTX 1080 Ti, Xeon E5-2623 v3), three cohort sizes:
# 14.6 s at N=1, 13.6 s at N=4 and 28.6 s at N=16 => ~12 s fixed plus ~1 s/subject.
# Overwhelmingly container start, CUDA init and loading the model; inference itself
# is about a second per scan. Measured by duplicating one real PET scan, so the
# per-subject figure reflects a single image size.
fixed_seconds: 12
time_per_subject_seconds: 1.0

container:
  image: cbica/amyloidpetnet:0.0.1
  # Apptainer/Singularity: entrypoint is 'micromamba run -n p3.7torch1.8 python'; the script's own shebang is base python3, so exec would run it outside the conda env.
  singularity_run_mode: run
  command: >-
    /app/scripts/nichart_predict_wrapper.py
    --input-dir {input_data}
    --output-dir {output_data}
    --model-dir /app/model
    --cache-dir /tmp
    --output-csv-name predictions.csv
