name: nichart_dlwmls
description: Segments white matter lesions on FLAIR MRI brain scans, producing segmentations and regional volumes.

inputs:
  fl_img:
    type: directory

outputs:
  dlwmls_seg:
    type: directory
  dlwmls_vol:
    type: file

mounts:
  fl_img:
    path_in_container: /input/fl
    mode: ro
  dlwmls_seg:
    path_in_container: /output/DLWMLS_seg
    mode: rw
  dlwmls_vol:
    path_in_container: /output/DLWMLS_Volumes.csv
    mode: rw

parameters: {}

resources:
  vcpus: 4
  memory: 28000
  gpus: 1

time_per_subject_seconds: null

container:
  image: cbica/dlwmls_wrapped:0.0.1
  command: --in_dir {fl_img} --out_seg {dlwmls_seg} --out_csv {dlwmls_vol} -device cuda
