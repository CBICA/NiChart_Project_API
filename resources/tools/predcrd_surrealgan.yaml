name: predcrd_surrealgan
description: Predicts SurrealGAN R-Scores along 5 disease progression dimensions from DLMUSE ROIs and demographics.

inputs:
  dlmuse_vol:
    type: file
  demog_csv:
    type: file

outputs:
  surrealgan_csv:
    type: file

mounts:
  dlmuse_vol:
    path_in_container: /input/dlmuse.csv
    mode: ro
  demog_csv:
    path_in_container: /input/demog.csv
    mode: ro
  surrealgan_csv:
    path_in_container: /output/SurrealGAN_RScores.csv
    mode: rw

parameters: {}

resources:
  vcpus: 2
  memory: 14000
  gpus: 0

# Measured 2026-11-12 on cbica/surrealgan_predcrd_wrapped:0.0.1, this dev box (GTX 1080 Ti, Xeon E5-2623 v3), three
# cohort sizes: 4.5 s at N=1, 4.5 s at N=4 and 5.5 s at N=100 => ~4.5 s fixed plus
# ~0.01 s/subject. A batch CSV tool: effectively all container start and model load.
# (The very first run of the image took 6.4 s cold.)
fixed_seconds: 5
time_per_subject_seconds: 0.01

container:
  image: cbica/surrealgan_predcrd_wrapped:0.0.1
  command: --roi_csv {dlmuse_vol} --demog_csv {demog_csv} --out_csv {surrealgan_csv}
