name: synthseg
description: >
  Performs whole-brain MRI segmentation using SynthSeg, producing segmentation
  label maps and a CSV of regional volumes (mm3) for all subjects.

inputs:
  t1_img:
    type: directory

outputs:
  synthseg_seg:
    type: directory
  synthseg_vol:
    type: directory

mounts:
  t1_img:
    path_in_container: /input/t1
    mode: ro
  synthseg_seg:
    path_in_container: /output/synthseg_seg
    mode: rw
  synthseg_vol:
    path_in_container: /output/synthseg_vol
    mode: rw

parameters: {}

resources:
  vcpus: 4
  memory: 8192  # peak observed ~6.1 GiB on CPU; 8 GiB gives headroom
  gpus: 1       # requires ≥12 GiB VRAM (SynthSeg 2.0 full-resolution U-Net)

time_per_subject_seconds: 120.0  # estimated GPU (V100/A100); CPU measured at ~454 s

container:
  image: cbica/synthseg:conda-0.2-wrapped-gpu
  command: "{t1_img} {synthseg_seg} {synthseg_vol}"
