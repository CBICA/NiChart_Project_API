name: synthseg
description: >
  Performs whole-brain MRI segmentation using SynthSeg, producing segmentation
  label maps and a CSV of regional volumes (mm3) for all subjects.

inputs:
  t1_img:
    type: directory

outputs:
  synthseg_seg:
    type: directory
  synthseg_vol:
    type: directory

mounts:
  t1_img:
    path_in_container: /input/t1
    mode: ro
  synthseg_seg:
    path_in_container: /output/synthseg_seg
    mode: rw
  synthseg_vol:
    path_in_container: /output/synthseg_vol
    mode: rw

parameters: {}

resources:
  vcpus: 4
  memory: 12288  # estimate — raised for --parc; not re-measured (prior non-parc peak ~6.1 GiB on CPU)
  gpus: 1        # with --parc (cortical parcellation) needs ≥16 GiB VRAM — OOMs on an 11 GiB card
                 # (GTX 1080 Ti); schedule on a 16 GiB+ GPU (T4-16G / V100 / L4 / A100)

time_per_subject_seconds: 240.0  # estimate — --parc adds a parcellation network; not re-measured on GPU

container:
  image: cbica/synthseg:conda-0.3-wrapped-gpu
  command: "{t1_img} {synthseg_seg} {synthseg_vol}"
