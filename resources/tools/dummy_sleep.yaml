name: dummy_sleep
description: >
  Synthetic tool that sleeps for a configurable duration and writes a placeholder
  output file. Used for testing pipeline orchestration, step caching, provenance
  writing, and the jobs API without real imaging data.

inputs: {}
outputs:
  result:
    type: directory
mounts:
  result:
    path_in_container: /output
    mode: rw

resources:
  vcpus: 1
  memory: 256
  gpus: 0

container:
  image: "alpine:3.19"
  command: "sh -c 'echo \"[dummy_sleep] starting, will sleep {duration_seconds}s\"; sleep {duration_seconds}; echo \"[dummy_sleep] done\"; echo placeholder-output > /output/result.txt'"

parameters:
  duration_seconds:
    type: int
    default: 10

# Optional: expected wall-clock seconds to process one subject.
# Used by GET /cloud/status to estimate queue drain time.
# null means no estimate is available for this tool.
time_per_subject_seconds: null
