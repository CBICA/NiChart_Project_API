name: merge_feature_csvs_by_mrid
description: Merges two feature CSVs on the MRID key, producing a single combined CSV.

inputs:
  csv_1:
    type: file
    csv_columns: [MRID]
  csv_2:
    type: file
    csv_columns: [MRID]

outputs:
  out_csv:
    type: file
    csv_columns: [MRID]
    # Observed: one row per subject (100 rows at N=100).
    rows_per_subject: true

mounts:
  csv_1:
    path_in_container: /input/csv_1.csv
    mode: ro
  csv_2:
    path_in_container: /input/csv_2.csv
    mode: ro
  out_csv:
    path_in_container: /output/csv_out.csv
    mode: rw

parameters: {}

resources:
  vcpus: 2
  memory: 14000
  gpus: 0

# Measured 2026-11-12 on cbica/merge_feature_csvs:0.0.1, this dev box (GTX 1080 Ti, Xeon E5-2623 v3), two cohort
# sizes: 1.7 s at N=1 and 2.5 s at N=100 (410-column CSVs) => ~1.7 s fixed plus
# ~0.008 s/subject. Essentially free: a pandas merge behind a container start.
fixed_seconds: 2
time_per_subject_seconds: 0.008

container:
  image: cbica/merge_feature_csvs:0.0.1
  command: --csvone {csv_1} --csvtwo {csv_2} --output {out_csv}
