name: nichart_dlwmls_v2
description: >
  Segments white matter lesions on FLAIR MRI brain scans using T1-DLMUSE context,
  producing segmentations and regional lesion volumes.

inputs:
  fl_img:
    type: directory
  t1_img:
    type: directory
  dlmuse_seg:
    type: directory
    # DELIBERATELY UNDECLARED. This tool is invoked with
    # --dlmuse_suff _T1_DLMUSE.nii.gz, i.e. it expects {MRID}_T1_DLMUSE.nii.gz,
    # but nichart_dlmuse is observed to write {MRID}_DLMUSE.nii.gz, which is
    # also what run_dlmuse.yaml's results.per_subject declares and what every
    # other consumer of dlmuse_seg/ matches (--mask_suffix _DLMUSE). One of the
    # two is wrong and the suffix needs checking against the container's
    # --infer-mrids behaviour before either is written down here; declaring the
    # flag's value would encode a suspected bug as the expectation.
  demog_csv:
    type: file
    csv_columns: [MRID]

outputs:
  nichart_dlwmls_out:
    type: directory
    # Observed (container run 2026-11-12, N=4), and what run_nichart_dlwmls_v2.yaml's
    # results declare: per-subject lesion segmentations in two spaces plus one
    # cohort CSV of regional lesion volumes.
    contents:
      - pattern: "DLWMLS_DLMUSE_Segmented/{MRID}_DLWMLS_DLMUSE_Segmented.nii.gz"
        per_subject: true
      - pattern: "DLWMLS_FLAIR/{MRID}_FL_LPS_DLWMLS.nii.gz"
        per_subject: true
      - pattern: "DLWMLS_DLMUSE_Segmented_Volumes.csv"
        csv_columns: [MRID]
        rows_per_subject: true

mounts:
  fl_img:
    path_in_container: /input/fl
    mode: ro
  t1_img:
    path_in_container: /input/t1
    mode: ro
  dlmuse_seg:
    path_in_container: /input/dlmuse_seg
    mode: ro
  demog_csv:
    path_in_container: /input/demog.csv
    mode: ro
  nichart_dlwmls_out:
    path_in_container: /output/nichart_dlwmls_out
    mode: rw

parameters: {}

resources:
  vcpus: 4
  memory: 28000
  gpus: 1

# Measured 2026-11-12 on cbica/nichart_dlwmls:0.0.3, this dev box (GTX 1080 Ti, Xeon E5-2623 v3), three cohort
# sizes: 39.7 s at N=1, 64.0 s at N=4 and 110.4 s at N=8 => ~27 s fixed plus
# ~10 s/subject. The fixed part is container start, CUDA init and loading the
# nnU-Net weights; the per-subject part is LPS conversion, inference and the
# DLMUSE-space resampling.
fixed_seconds: 27
time_per_subject_seconds: 10.0

container:
  image: cbica/nichart_dlwmls:0.0.3
  command: --list {demog_csv} --fl_dir {fl_img} --t1_dir {t1_img} --dlmuse_dir {dlmuse_seg} --out_dir {nichart_dlwmls_out} --device cuda --named-headers --dlmuse_suff _T1_DLMUSE.nii.gz --infer-mrids
