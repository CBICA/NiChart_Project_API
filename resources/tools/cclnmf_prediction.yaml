name: cclnmf_prediction
description: Predicts CCL-NMF component loading coefficients from DLMUSE ROI volumes and demographics.

inputs:
  dlmuse_vol:
    type: file
  demog_csv:
    type: file

outputs:
  cclnmf_csv:
    type: file

mounts:
  dlmuse_vol:
    path_in_container: /input/dlmuse.csv
    mode: ro
  demog_csv:
    path_in_container: /input/demog.csv
    mode: ro
  cclnmf_csv:
    path_in_container: /output/CCLNMF.csv
    mode: rw

parameters: {}

resources:
  vcpus: 2
  memory: 14000
  gpus: 0

time_per_subject_seconds: null

container:
  image: cbica/ccl_nmf_prediction_wrapped:0.0.1
  command: --roi_csv {dlmuse_vol} --demog_csv {demog_csv} --out_csv {cclnmf_csv}
