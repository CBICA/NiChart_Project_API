name: cclnmf_prediction
description: Predicts CCL-NMF component loading coefficients from DLMUSE ROI volumes and demographics.

inputs:
  dlmuse_vol:
    type: file
  demog_csv:
    type: file

outputs:
  cclnmf_csv:
    type: file

mounts:
  dlmuse_vol:
    path_in_container: /input/dlmuse.csv
    mode: ro
  demog_csv:
    path_in_container: /input/demog.csv
    mode: ro
  cclnmf_csv:
    path_in_container: /output/CCLNMF_prediction_loadings.csv
    mode: rw

parameters: {}

resources:
  vcpus: 2
  memory: 14000
  gpus: 0

# Measured 2026-11-12 on cbica/ccl_nmf_prediction_wrapped:0.0.1, this dev box (GTX 1080 Ti, Xeon E5-2623 v3), two
# cohort sizes: 3.5 s at N=1 and 3.4 s at N=100 => ~3.5 s fixed and no per-subject
# cost that is measurable at this scale. The seven CCL-NMF loadings are predicted
# in one vectorised pass, so cost is container start and model load.
fixed_seconds: 4
time_per_subject_seconds: null

container:
  image: cbica/ccl_nmf_prediction_wrapped:0.0.1
  command: --roi_csv {dlmuse_vol} --demog_csv {demog_csv} --out_csv {cclnmf_csv}
