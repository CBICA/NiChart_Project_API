[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nichart-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "docker>=7.0",
    "pydicom>=2.4",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
nichart = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "anyio[trio]>=4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
